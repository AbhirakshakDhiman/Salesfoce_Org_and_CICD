name: Salesforce CI/CD

on:
  push:
    branches:
      - feature/*
      - develop
  pull_request:
    branches:
      - develop
      - main

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: |
          npm install sfdx-cli --global
          sfdx --version
          sfdx plugins --core

      - name: Authenticate to Salesforce
        run: |
          echo "${{ secrets.SF_JWT_KEY }}" > server.key
          sfdx force:auth:jwt:grant \
            --clientid ${{ secrets.SF_CONSUMER_KEY }} \
            --jwtkeyfile server.key \
            --username ${{ secrets.SF_USERNAME }} \
            --instanceurl https://login.salesforce.com \
            --setdefaultusername

      - name: Verify org authentication
        run: sfdx force:org:list

      - name: Get changed metadata
        id: changed
        run: |
          # List changed files compared to develop
          CHANGED_FILES=$(git diff --name-only origin/develop...HEAD | grep 'force-app/' | paste -sd, -)
          echo "CHANGED_FILES=$CHANGED_FILES" >> $GITHUB_ENV

          # Extract Apex test classes for changed classes
          CHANGED_TESTS=$(git diff --name-only origin/develop...HEAD | grep 'classes/' | sed 's/\.cls$/Test/' | paste -sd, -)
          echo "CHANGED_TESTS=$CHANGED_TESTS" >> $GITHUB_ENV

          echo "Changed metadata: $CHANGED_FILES"
          echo "Changed tests: $CHANGED_TESTS"

      - name: Validate Deployment (only changed metadata, with timeout)
        run: |
          export NODE_OPTIONS=--max-old-space-size=4096
          if [ -n "${{ env.CHANGED_FILES }}" ]; then
            timeout 10m sfdx force:source:deploy \
              -p "${{ env.CHANGED_FILES }}" \
              --checkonly \
              --testlevel RunSpecifiedTests \
              --runtests "${{ env.CHANGED_TESTS }}" \
              --json
          else
            echo "No changed metadata to deploy."
          fi

      - name: Deploy if Validation Passes (only on develop)
        if: github.ref == 'refs/heads/develop' && env.CHANGED_FILES != ''
        run: |
          export NODE_OPTIONS=--max-old-space-size=4096
          sfdx force:source:deploy \
            -p "${{ env.CHANGED_FILES }}" \
            --testlevel RunSpecifiedTests \
            --runtests "${{ env.CHANGED_TESTS }}" \
            --json
